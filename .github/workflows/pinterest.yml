name: Pinterest Auto-Poster

on:
  # Auto-schedule disabled — only manual trigger via GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Pinterest poster
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: npx tsx tools/pinterest/post.ts

      - name: Commit posted log
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add tools/pinterest/posted.json tools/pinterest/last-run.json
          git diff --staged --quiet || git commit -m "Update Pinterest posted log [skip ci]"
          git push
